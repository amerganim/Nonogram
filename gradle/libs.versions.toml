# Version catalog. Per build plan section 2: "Verify library versions before adding
# dependencies... If a version in this doc conflicts with what's current, current wins."
# Resolved against Google Maven / Maven Central on 2026-09-19.
#
# Note: AGP 9 has built-in Kotlin support, so there is deliberately no
# org.jetbrains.kotlin.android plugin here - applying it is an error from AGP 9.0 on.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
junit = "6.1.3"
kotest = "6.2.5"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
desugar = "2.1.5"
navigationCompose = "2.10.1"
datastore = "1.2.1"
room = "2.8.5"
ksp = "2.3.12"
playServicesAds = "25.5.0"
billing = "9.1.0"
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# java.time on API 24-25, which minSdk 24 needs for LocalDate in the daily/streak logic.
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
# Play deprecates old Billing versions on a schedule and rejects uploads built against
# them, so check this is still current before each release (build plan 2).
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose compiler. Required from Kotlin 2.0 whenever buildFeatures.compose is on,
# even though AGP 9 provides Kotlin itself. Version tracks the Kotlin compiler.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
